<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">AWS database decision tree</title>
  <desc id="desc">Decision tree for choosing AWS database services by workload pattern, access pattern, scale, latency, and exam cues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#eef6f8"/>
    </linearGradient>
    <linearGradient id="start" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title{font:800 48px Arial, Helvetica, sans-serif;fill:#0f172a}
      .subtitle{font:500 22px Arial, Helvetica, sans-serif;fill:#475467}
      .node-title{font:800 23px Arial, Helvetica, sans-serif;fill:#111827}
      .node-text{font:500 17px Arial, Helvetica, sans-serif;fill:#475467}
      .cue{font:800 15px Arial, Helvetica, sans-serif;fill:#7c2d12}
      .label{font:800 15px Arial, Helvetica, sans-serif;fill:#ffffff}
      .small{font:700 14px Arial, Helvetica, sans-serif;fill:#334155}
      .connector{stroke:#94a3b8;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .service{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .service-accent{stroke:#f59e0b;stroke-width:6}
      .question{fill:#ffffff;stroke:#0f766e;stroke-width:3}
      .badge{fill:#ecfeff;stroke:#67e8f9;stroke-width:1.5}
      .badge-text{font:800 13px Arial, Helvetica, sans-serif;fill:#155e75}
    </style>
  </defs>

  <rect width="1600" height="1120" rx="34" fill="url(#bg)"/>
  <rect x="36" y="34" width="1528" height="1052" rx="26" fill="#ffffff" stroke="#dbe4f0" stroke-width="3"/>

  <text x="800" y="96" text-anchor="middle" class="title">AWS Database Decision Tree</text>
  <text x="800" y="132" text-anchor="middle" class="subtitle">Follow the access pattern first, then confirm latency, scale, availability, and cost.</text>

  <rect x="472" y="172" width="656" height="118" rx="20" fill="url(#start)" filter="url(#shadow)"/>
  <text x="800" y="220" text-anchor="middle" class="label" style="font-size:28px">What does the exam question emphasize?</text>
  <text x="800" y="254" text-anchor="middle" class="label" style="font-size:18px">Data shape + query pattern usually decides the database.</text>

  <path class="connector" d="M800 290 V338 M250 338 H1350 M250 338 V376 M800 338 V376 M1350 338 V376"/>

  <g filter="url(#shadow)">
    <rect class="question" x="74" y="376" width="352" height="150" rx="16"/>
    <circle cx="113" cy="417" r="23" fill="#0f766e"/><text x="113" y="424" text-anchor="middle" class="label">1</text>
    <text x="148" y="407" class="node-title">SQL, joins, transactions?</text>
    <text x="102" y="448" class="node-text">Relational model, constraints,</text>
    <text x="102" y="474" class="node-text">existing engine, or OLTP app.</text>
  </g>
  <path class="connector" d="M250 526 V574"/>
  <g filter="url(#shadow)">
    <rect class="service service-accent" x="58" y="574" width="180" height="134" rx="14"/>
    <text x="148" y="618" text-anchor="middle" class="node-title">RDS</text>
    <text x="84" y="649" class="node-text">Managed MySQL,</text>
    <text x="84" y="673" class="node-text">PostgreSQL, MariaDB,</text>
    <text x="84" y="697" class="cue">Multi-AZ failover</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="service service-accent" x="264" y="574" width="180" height="134" rx="14"/>
    <text x="354" y="618" text-anchor="middle" class="node-title">Aurora</text>
    <text x="290" y="649" class="node-text">Higher performance</text>
    <text x="290" y="673" class="node-text">SQL compatibility</text>
    <text x="290" y="697" class="cue">Global DB for DR</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="question" x="624" y="376" width="352" height="150" rx="16"/>
    <circle cx="663" cy="417" r="23" fill="#0f766e"/><text x="663" y="424" text-anchor="middle" class="label">2</text>
    <text x="698" y="407" class="node-title">Simple key-value lookup?</text>
    <text x="652" y="448" class="node-text">Known partition key, very high</text>
    <text x="652" y="474" class="node-text">request rate, serverless scale.</text>
  </g>
  <path class="connector" d="M800 526 V574"/>
  <g filter="url(#shadow)">
    <rect class="service service-accent" x="604" y="574" width="190" height="134" rx="14"/>
    <text x="699" y="618" text-anchor="middle" class="node-title">DynamoDB</text>
    <text x="630" y="649" class="node-text">NoSQL key-value</text>
    <text x="630" y="673" class="node-text">and document data</text>
    <text x="630" y="697" class="cue">DAX for microseconds</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="service service-accent" x="818" y="574" width="190" height="134" rx="14"/>
    <text x="913" y="618" text-anchor="middle" class="node-title">Keyspaces</text>
    <text x="844" y="649" class="node-text">Cassandra-compatible</text>
    <text x="844" y="673" class="node-text">managed wide-column</text>
    <text x="844" y="697" class="cue">Cassandra cue</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="question" x="1174" y="376" width="352" height="150" rx="16"/>
    <circle cx="1213" cy="417" r="23" fill="#0f766e"/><text x="1213" y="424" text-anchor="middle" class="label">3</text>
    <text x="1248" y="407" class="node-title">Analytics or warehouse?</text>
    <text x="1202" y="448" class="node-text">BI, reporting, summarization,</text>
    <text x="1202" y="474" class="node-text">large scans, or S3 SQL.</text>
  </g>
  <path class="connector" d="M1350 526 V574"/>
  <g filter="url(#shadow)">
    <rect class="service service-accent" x="1158" y="574" width="180" height="134" rx="14"/>
    <text x="1248" y="618" text-anchor="middle" class="node-title">Redshift</text>
    <text x="1184" y="649" class="node-text">OLAP warehouse</text>
    <text x="1184" y="673" class="node-text">for repeated analytics</text>
    <text x="1184" y="697" class="cue">Not OLTP</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="service service-accent" x="1364" y="574" width="180" height="134" rx="14"/>
    <text x="1454" y="618" text-anchor="middle" class="node-title">Athena</text>
    <text x="1390" y="649" class="node-text">Serverless SQL</text>
    <text x="1390" y="673" class="node-text">directly on S3</text>
    <text x="1390" y="697" class="cue">Query files</text>
  </g>

  <path class="connector" d="M800 708 V755 M145 755 H1454 M145 755 V792 M520 755 V792 M890 755 V792 M1265 755 V792"/>

  <g filter="url(#shadow)">
    <rect class="question" x="58" y="792" width="250" height="102" rx="16"/>
    <text x="84" y="828" class="node-title">Repeated reads?</text>
    <text x="84" y="858" class="node-text">Cache or sessions.</text>
  </g>
  <path class="connector" d="M183 894 V928"/>
  <g filter="url(#shadow)">
    <rect class="service service-accent" x="58" y="928" width="250" height="118" rx="14"/>
    <text x="183" y="971" text-anchor="middle" class="node-title">ElastiCache</text>
    <text x="88" y="1004" class="node-text">Redis or Memcached</text>
    <text x="88" y="1028" class="cue">General cache answer</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="question" x="395" y="792" width="250" height="102" rx="16"/>
    <text x="421" y="828" class="node-title">Relationships?</text>
    <text x="421" y="858" class="node-text">Traverse connected data.</text>
  </g>
  <path class="connector" d="M520 894 V928"/>
  <g filter="url(#shadow)">
    <rect class="service service-accent" x="395" y="928" width="250" height="118" rx="14"/>
    <text x="520" y="971" text-anchor="middle" class="node-title">Neptune</text>
    <text x="425" y="1004" class="node-text">Graph database</text>
    <text x="425" y="1028" class="cue">Fraud, social, recommendations</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="question" x="765" y="792" width="250" height="102" rx="16"/>
    <text x="791" y="828" class="node-title">MongoDB API?</text>
    <text x="791" y="858" class="node-text">JSON documents.</text>
  </g>
  <path class="connector" d="M890 894 V928"/>
  <g filter="url(#shadow)">
    <rect class="service service-accent" x="765" y="928" width="250" height="118" rx="14"/>
    <text x="890" y="971" text-anchor="middle" class="node-title">DocumentDB</text>
    <text x="795" y="1004" class="node-text">MongoDB-compatible</text>
    <text x="795" y="1028" class="cue">Not Cassandra</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="question" x="1140" y="792" width="250" height="102" rx="16"/>
    <text x="1166" y="828" class="node-title">Time windows?</text>
    <text x="1166" y="858" class="node-text">Metrics, IoT, telemetry.</text>
  </g>
  <path class="connector" d="M1265 894 V928"/>
  <g filter="url(#shadow)">
    <rect class="service service-accent" x="1140" y="928" width="250" height="118" rx="14"/>
    <text x="1265" y="971" text-anchor="middle" class="node-title">Timestream</text>
    <text x="1170" y="1004" class="node-text">Time-series database</text>
    <text x="1170" y="1028" class="cue">Retention tiers cue</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1410" y="792" width="126" height="254" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="1473" y="827" text-anchor="middle" class="small">Migration?</text>
    <text x="1473" y="861" text-anchor="middle" class="node-title">DMS</text>
    <text x="1473" y="887" text-anchor="middle" class="node-text">data</text>
    <text x="1473" y="935" text-anchor="middle" class="node-title">SCT</text>
    <text x="1473" y="961" text-anchor="middle" class="node-text">schema</text>
    <text x="1473" y="1016" text-anchor="middle" class="cue">Engine change</text>
  </g>
</svg>
